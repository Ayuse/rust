name: Compiler Coverage

# Runs coverage analysis on the Rust compiler using an instrumented stage1 build.
# Produces HTML + JSON reports and posts a markdown summary to the job page.
#
# Modes:
#   quick  — 5 key test suites (async-await, coroutine, traits, closures, impl-trait)
#   full   — all of tests/ui (~20,000 tests)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Coverage mode: quick or full"
        required: false
        default: quick
  schedule:
    # Run quick coverage weekly on Sunday at 02:00 UTC
    - cron: "0 2 * * 0"

jobs:
  coverage:
    name: Compiler coverage (${{ github.event.inputs.mode || 'quick' }} mode)
    runs-on: ubuntu-latest
    # ubuntu-latest: 4 CPUs, 16GB RAM, ~84GB disk — sufficient for quick mode.
    # For full mode, consider a larger runner.
    timeout-minutes: 240

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup
          sudo rm -rf /opt/az /imagegeneration
          sudo docker image prune -a -f 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Needs enough history for bootstrap to find a bors-authored upstream
          # commit (for download-ci-llvm). Our fork has <50 custom commits.
          fetch-depth: 256

      - name: Install dependencies
        run: |
          # Install LLVM 19 — must match profraw format version 10 used by current nightly rustc.
          # Ubuntu apt ships LLVM 18 (format v9) which is incompatible.
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | \
            sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main" | \
            sudo tee /etc/apt/sources.list.d/llvm-19.list
          sudo apt-get update -q
          sudo apt-get install -y -q llvm-19 rustfilt || true
          # Make llvm-19 tools available as unversioned names
          sudo update-alternatives --install /usr/bin/llvm-profdata llvm-profdata \
            /usr/bin/llvm-profdata-19 100
          sudo update-alternatives --install /usr/bin/llvm-cov llvm-cov \
            /usr/bin/llvm-cov-19 100

      - name: Configure build
        run: |
          cp bootstrap.example.toml config.toml
          cat >> config.toml << 'EOF'

          [build]
          profiler = true

          [llvm]
          download-ci-llvm = "if-unchanged"
          EOF

      - name: Cache stage1 build
        id: cache-stage1
        uses: actions/cache@v4
        with:
          path: build
          key: stage1-instrumented-v4-${{ runner.os }}-${{ hashFiles('src/llvm-project') }}

      - name: Build instrumented stage1
        if: steps.cache-stage1.outputs.cache-hit != 'true'
        run: |
          # Unset GITHUB_ACTIONS so bootstrap uses the non-CI commit detection path.
          # On CI, bootstrap assumes HEAD is a bors merge commit and returns HEAD^1
          # as the upstream SHA for downloading CI LLVM. On a fork's workflow_dispatch,
          # HEAD is a regular commit, so HEAD^1 is also ours — no CI artifacts exist.
          # The non-CI path properly searches git history for bors-authored commits.
          unset GITHUB_ACTIONS
          RUSTFLAGS_BOOTSTRAP="-Cinstrument-coverage -Ccodegen-units=1" \
            python3 x.py build library --stage 1 --set build.profiler=true

      - name: Trim build dir before caching
        if: steps.cache-stage1.outputs.cache-hit != 'true'
        run: |
          # Remove LLVM source-build artifacts (multi-GB) — we use ci-llvm/ (downloaded).
          # Also remove incremental caches and other bulk that isn't needed at test time.
          rm -rf build/x86_64-unknown-linux-gnu/llvm
          rm -rf build/x86_64-unknown-linux-gnu/lld
          find build -name incremental -type d -exec rm -rf {} + 2>/dev/null || true
          du -sh build/

      - name: Save stage1 cache (eager — saves even if later steps fail)
        if: steps.cache-stage1.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build
          key: stage1-instrumented-v4-${{ runner.os }}-${{ hashFiles('src/llvm-project') }}

      - name: Verify runtest.rs patch is applied
        run: |
          grep -q "COMPILETEST_LLVM_PROFILE_DIR" src/tools/compiletest/src/runtest.rs || \
            { echo "ERROR: runtest.rs missing COMPILETEST_LLVM_PROFILE_DIR patch"; exit 1; }

      - name: Run coverage pipeline
        env:
          COVERAGE_MODE: ${{ github.event.inputs.mode || 'quick' }}
        run: bash coverage/run_coverage.sh

      - name: Post markdown summary
        run: |
          python3 coverage/analyze.py coverage/out-compiler/coverage.json --format md \
            >> "$GITHUB_STEP_SUMMARY"

      # Upload only JSON + profdata — HTML is ~425MB and exceeds free plan artifact limits.
      # HTML can be regenerated locally from the profdata artifact if needed.
      - name: Upload coverage JSON
        uses: actions/upload-artifact@v4
        with:
          name: coverage-json-${{ github.event.inputs.mode || 'quick' }}
          path: coverage/out-compiler/coverage.json
          retention-days: 14

      - name: Upload merged profdata
        uses: actions/upload-artifact@v4
        with:
          name: coverage-profdata-${{ github.event.inputs.mode || 'quick' }}
          path: coverage/out-compiler/merged.profdata
          retention-days: 14

      - name: Sanity check — coverage above threshold
        run: |
          python3 - <<'EOF'
          import json, sys
          with open("coverage/out-compiler/coverage.json") as f:
              data = json.load(f)
          s = data["data"][0]["totals"]["lines"]
          pct = s["covered"] / s["count"] * 100
          print(f"Line coverage: {pct:.1f}%")
          if pct < 55:
              print("ERROR: coverage dropped below 55% sanity threshold")
              sys.exit(1)
          EOF
